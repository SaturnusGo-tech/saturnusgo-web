name: Validate static export

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --pretty false --incremental false

      - name: Check TMS architecture
        run: npm run architecture:tms

      - name: Validate TMS production API boundary
        run: |
          boundary_dir=$(mktemp -d)
          npx tsc \
            app/src/core/tms/config/api-base.ts \
            app/src/core/tms/config/api-base.test.ts \
            --module commonjs \
            --target es2021 \
            --outDir "$boundary_dir" \
            --esModuleInterop \
            --skipLibCheck
          node --test "$boundary_dir/api-base.test.js"

      - name: Validate generated TMS contract
        run: npm run check:tms-contract

      - name: Test private TMS attachments
        run: npm run test:tms-attachments

      - name: Test TMS Auth0 boundary
        run: npm run test:tms-auth

      - name: Build static export
        env:
          BUILD_TARGET: export
          NEXT_PUBLIC_AUTH0_DOMAIN: dev-4v1srvqwzp1m7cdl.us.auth0.com
          NEXT_PUBLIC_AUTH0_CLIENT_ID: CQjoUKhO0f73Cb80jmWNiGXuyZt1TviC
          NEXT_PUBLIC_AUTH0_AUDIENCE: https://api.tms.saturnusgo.com
          NEXT_PUBLIC_TMS_API_BASE: https://umbrella-home-tms-backend-production.up.railway.app/api/v1
        run: |
          set -euo pipefail
          restore_api() {
            if [ -d ../_app_api_for_export ]; then
              mv ../_app_api_for_export app/api
            fi
          }
          trap restore_api EXIT
          if [ -d app/api ]; then
            mv app/api ../_app_api_for_export
          fi
          npm run build
          restore_api
          trap - EXIT

      - name: Verify canonical TMS artifact
        run: |
          test -f out/testcases/umbrella-home/work/index.html
          if find out/testcases -type d | grep -Eq 'UmbrellaHome|/Work$'; then
            echo 'Legacy mixed-case TMS route was emitted.' >&2
            exit 1
          fi
          if rg -n 'http://localhost:4100|/testcases/UmbrellaHome/Work' out; then
            echo 'Local API or legacy TMS route leaked into the export.' >&2
            exit 1
          fi
